version: 1

doctrine:
  name: ASI Verifiable Engineering
  version: "1.2"
  skill_version: "0.1.0-draft.2"
  source: "skills/asi-verifiable-engineering/SKILL.md"

governance:
  operator_mode: solo
  high_risk_authorization: owner_merge
  critical_risk_authorization: dual_human

repository:
  default_risk: high
  policy_owner: "Eidon"
  protected_branches:
    - main
  protected_paths:
    - ".asi/**"
    - ".github/**"
    - "mypy.ini"
    - "requirements-ci.lock"
    - "skills/asi-verifiable-engineering/SKILL.md"
    - "skills/asi-verifiable-engineering/references/**"
    - "skills/asi-verifiable-engineering/scripts/**"
    - "tests/**"
    - "tools/**"

commands:
  install: "python -m pip install --disable-pip-version-check --no-deps -r requirements-ci.lock"
  integrity: "python skills/asi-verifiable-engineering/scripts/verify_change_budget.py --budget .asi/change-budget.json"
  branch_protection: "python skills/asi-verifiable-engineering/scripts/check_branch_protection.py"
  format_check: "python skills/asi-verifiable-engineering/scripts/check_format.py ."
  lint: "python -m ruff check ."
  typecheck: "python -m mypy --config-file mypy.ini tools skills/asi-verifiable-engineering/scripts"
  build: "python tools/validate_skill_package.py skills/asi-verifiable-engineering"
  package_installability: "python skills/asi-verifiable-engineering/scripts/verify_installability.py skills/asi-verifiable-engineering"
  unit_tests: "python -m unittest discover -s tests -p test_*.py -v"
  integration_tests: "python -m unittest discover -s tests -p test_integration*.py -v"
  secret_scan: "python skills/asi-verifiable-engineering/scripts/scan_secrets.py ."
  dependency_scan: "python skills/asi-verifiable-engineering/scripts/scan_supply_chain.py ."
  test_honesty: "python -m unittest tests.test_adversarial_controls -v"
  rollback_check: "python skills/asi-verifiable-engineering/scripts/verify_source_rollback.py"
  independent_audit: "python skills/asi-verifiable-engineering/scripts/collect_github_review.py --require-audit"
  target_environment_observation: "python skills/asi-verifiable-engineering/scripts/collect_github_review.py --require-observation"

required_gates:
  integrity: true
  branch_protection: true
  format_check: true
  lint: true
  typecheck: true
  build: true
  package_installability: true
  unit_tests: true
  integration_tests: true
  secret_scan: true
  dependency_scan: true
  rollback_check: true
  independent_audit: true
  target_environment_observation: true

risk_escalation:
  high:
    - ".asi/**"
    - ".github/**"
    - "mypy.ini"
    - "requirements-ci.lock"
    - "skills/asi-verifiable-engineering/SKILL.md"
    - "skills/asi-verifiable-engineering/references/**"
    - "skills/asi-verifiable-engineering/scripts/**"
    - "tests/**"
    - "tools/**"
  critical:
    - ".github/workflows/release-skill.yml"
    - "production-access/**"
    - "destructive-operations/**"

assurance:
  low:
    minimum_t: T4
    independence:
      - I1
      - I2
  medium:
    minimum_t: T4
    independence:
      - I1
      - I2
  high:
    minimum_t: T5
    independence:
      - I1
      - I2
  critical:
    minimum_t: T6
    independence:
      - I1
      - I2
      - I3
    dual_human_approval: true

automated_acceptance:
  enabled: true
  eligible_risks:
    - low
    - medium
  line_by_line_review_default: false
  require_all_required_gates_passed: true
  require_no_unverified: true
  require_no_residual_risks_for_automatic: true
  require_test_honesty: true
  require_change_budget: true
  require_distinct_builder_auditor: true
  require_rollback_tested: true
  require_policy_digest: true
  require_diff_digest: true

evidence:
  directory: ".asi/evidence"
  retention_days: 90
  require_commit_sha: true
  require_exit_codes: true
  require_artifact_digests: true
  require_measured_commands: true
  require_binding_verification: true

deployment:
  build_once_promote_same_artifact: true
  require_rollback: true
  require_canary_for_high_risk: true
  autonomous_production_changes: false

agent_permissions:
  direct_push_protected_branch: false
  self_approve: false
  forge_audit_attestation: false
  claim_owner_authorization: false
  modify_policy_in_same_change: false
  disable_required_gate: false
  access_production_secrets: false
  irreversible_action_without_human: false

exceptions:
  allow_permanent: false
  require_owner: true
  require_expiry: true
  require_compensating_controls: true
