name: Validate ASI Skill

on:
  pull_request:
  pull_request_review:
    types:
      - submitted
      - dismissed
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify measured gates and derive decision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/asi-pycache

    steps:
      - name: Check out exact integrable state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Prepare evidence and commit identity
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/asi-evidence"
          mkdir -p "$evidence_dir"
          evaluated_sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || \
             [ "$GITHUB_EVENT_NAME" = "pull_request_review" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            branch="$PR_BRANCH"
            builder="$PR_AUTHOR"
            pull_request="$PR_NUMBER"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$GITHUB_SHA"
            branch="$GITHUB_REF_NAME"
            builder="$GITHUB_ACTOR"
            pull_request="0"
          fi
          printf 'EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          printf 'ASI_BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"
          printf 'ASI_HEAD_SHA=%s\n' "$head_sha" >> "$GITHUB_ENV"
          printf 'ASI_EVALUATED_SHA=%s\n' "$evaluated_sha" >> "$GITHUB_ENV"
          printf 'ASI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"
          printf 'ASI_BUILDER=%s\n' "$builder" >> "$GITHUB_ENV"
          printf 'ASI_REPOSITORY=%s\n' "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          printf 'ASI_PR_NUMBER=%s\n' "$pull_request" >> "$GITHUB_ENV"
          printf 'evaluated_commit=%s\n' "$evaluated_sha"
          python --version
          git status --short

      - name: Install pinned CI toolchain
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name install
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key install

      - name: Integrity and change-budget gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name integrity
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key integrity

      - name: Source rollback rehearsal gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name rollback_check
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key rollback_check

      - name: Format gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name format_check
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key format_check

      - name: Lint gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name lint
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key lint

      - name: Type-check gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name typecheck
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key typecheck

      - name: Build and package gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name build
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key build

      - name: Portable package installability gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name package_installability
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key package_installability

      - name: Unit and regression gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name unit_tests
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key unit_tests

      - name: Integration evidence gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name integration_tests
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key integration_tests

      - name: Dedicated secret-scan gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name secret_scan
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key secret_scan

      - name: Supply-chain and action-pin gate
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name dependency_scan
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key dependency_scan

      - name: Adversarial test-honesty control
        continue-on-error: true
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name test_honesty
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key test_honesty

      - name: Independent GitHub review attestation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python skills/asi-verifiable-engineering/scripts/run_gate.py
          --name independent_audit
          --output-dir "$EVIDENCE_DIR"
          --policy .asi/policy.yml
          --policy-key independent_audit

      - name: Generate actual commit-bound evidence
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python skills/asi-verifiable-engineering/scripts/generate_ci_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$ASI_BRANCH" \
            --base-commit "$ASI_BASE_SHA" \
            --head-commit "$ASI_HEAD_SHA" \
            --evaluated-commit "$ASI_EVALUATED_SHA" \
            --policy .asi/policy.yml \
            --budget .asi/change-budget.json \
            --output-dir "$EVIDENCE_DIR" \
            --repo-root . \
            --builder "$ASI_BUILDER" \
            --workflow-run "$RUN_URL" \
            --risk high \
            --skill-version "$(cat VERSION)" \
            --doctrine-version "1.2" \
            --unverified "Independent targeted human review is pending." \
            --unverified "Installation in the target agent environment is pending." \
            --unverified "Branch protection and required checks are not configured." \
            > "$EVIDENCE_DIR/generated-manifest-output.json"

      - name: Finalize measured rollback and package evidence
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/asi-verifiable-engineering/scripts/finalize_measured_evidence.py \
            "$EVIDENCE_DIR/manifest.json" \
            2>&1 | tee "$EVIDENCE_DIR/finalization.log"

      - name: Apply independent review attestation
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/asi-verifiable-engineering/scripts/apply_review_attestation.py \
            "$EVIDENCE_DIR/manifest.json" \
            "$EVIDENCE_DIR/gates/independent_audit.log" \
            2>&1 | tee "$EVIDENCE_DIR/review-application.log"

      - name: Recompute and validate evidence bindings
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/asi-verifiable-engineering/scripts/validate_evidence.py \
            "$EVIDENCE_DIR/manifest.json" \
            --evidence-dir "$EVIDENCE_DIR" \
            --policy .asi/policy.yml \
            --repo-root . \
            2>&1 | tee "$EVIDENCE_DIR/binding-validation.log"

      - name: Derive actual approval decision
        continue-on-error: true
        run: |
          set +e
          python skills/asi-verifiable-engineering/scripts/evaluate_change.py \
            .asi/policy.yml \
            "$EVIDENCE_DIR/manifest.json" \
            --evidence-dir "$EVIDENCE_DIR" \
            --repo-root . \
            > "$EVIDENCE_DIR/decision.json"
          status=$?
          printf '%s\n' "$status" > "$EVIDENCE_DIR/decision-exit-code.txt"
          cat "$EVIDENCE_DIR/decision.json"
          exit 0

      - name: Upload actual CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/asi-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Confirm clean working tree
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Enforce technical gates and derived approval
        if: always()
        run: |
          python - "$EVIDENCE_DIR/manifest.json" "$EVIDENCE_DIR/decision.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          decision = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          technical_failures = sorted(
              name
              for name, state in manifest["gates"].items()
              if name != "independent_audit" and state != "passed"
          )
          if technical_failures:
              raise SystemExit(
                  "Technical gates failed or were not verified: "
                  + ", ".join(technical_failures)
              )
          if decision["decision"] != "APPROVED":
              raise SystemExit(
                  "Commit remains blocked by derived decision: "
                  + "; ".join(decision["blockers"])
              )
          PY
