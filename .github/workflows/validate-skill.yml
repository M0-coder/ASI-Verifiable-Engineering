name: Validate ASI Skill

on:
  pull_request:
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-skill-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify measured gates and derive decision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/asi-pycache
      GITHUB_TOKEN: ${{ github.token }}
      ASI_GITHUB_ADMIN_TOKEN: ${{ secrets.ASI_GITHUB_ADMIN_TOKEN }}
      ASI_PROTECTED_BRANCH: main

    steps:
      - name: Check out exact integrable PR state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Prepare and verify commit identity
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/asi-evidence"
          evaluated_sha="$(git rev-parse HEAD)"
          builder_context_id="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.asi/change-budget.json').read_text(encoding='utf-8'))
          value = data.get('builder_context_id')
          if not isinstance(value, str) or not value.strip():
              raise SystemExit('builder_context_id is required in .asi/change-budget.json')
          print(value)
          PY
          )"
          mkdir -p "$evidence_dir"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$evaluated_sha"
          git merge-base --is-ancestor "$PR_HEAD_SHA" "$evaluated_sha"
          printf 'EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          printf 'ASI_BASE_SHA=%s\n' "$PR_BASE_SHA" >> "$GITHUB_ENV"
          printf 'ASI_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
          printf 'ASI_EVALUATED_SHA=%s\n' "$evaluated_sha" >> "$GITHUB_ENV"
          printf 'ASI_BRANCH=%s\n' "$PR_BRANCH" >> "$GITHUB_ENV"
          printf 'ASI_BUILDER_CONTEXT_ID=%s\n' "$builder_context_id" >> "$GITHUB_ENV"
          printf 'ASI_REPOSITORY=%s\n' "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          printf 'ASI_PR_NUMBER=%s\n' "$PR_NUMBER" >> "$GITHUB_ENV"
          printf 'base_commit=%s\n' "$PR_BASE_SHA"
          printf 'head_commit=%s\n' "$PR_HEAD_SHA"
          printf 'evaluated_commit=%s\n' "$evaluated_sha"
          printf 'builder_context_id=%s\n' "$builder_context_id"
          python --version
          git status --short

      - name: Execute measured policy gates
        run: |
          set +e
          runner="skills/asi-verifiable-engineering/scripts/run_gate.py"
          for gate in \
            install \
            integrity \
            branch_protection \
            rollback_check \
            format_check \
            lint \
            typecheck \
            build \
            package_installability \
            unit_tests \
            integration_tests \
            secret_scan \
            dependency_scan \
            test_honesty \
            independent_audit \
            target_environment_observation
          do
            python "$runner" \
              --name "$gate" \
              --output-dir "$EVIDENCE_DIR" \
              --policy .asi/policy.yml \
              --policy-key "$gate"
          done
          exit 0

      - name: Generate actual commit-bound evidence
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python skills/asi-verifiable-engineering/scripts/generate_ci_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$ASI_BRANCH" \
            --base-commit "$ASI_BASE_SHA" \
            --head-commit "$ASI_HEAD_SHA" \
            --evaluated-commit "$ASI_EVALUATED_SHA" \
            --policy .asi/policy.yml \
            --budget .asi/change-budget.json \
            --output-dir "$EVIDENCE_DIR" \
            --repo-root . \
            --builder "$ASI_BUILDER_CONTEXT_ID" \
            --workflow-run "$RUN_URL" \
            --risk high \
            --skill-version "$(cat VERSION)" \
            --doctrine-version "1.2" \
            > "$EVIDENCE_DIR/generated-manifest-output.json"

      - name: Finalize measured rollback and package evidence
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/asi-verifiable-engineering/scripts/finalize_measured_evidence.py \
            "$EVIDENCE_DIR/manifest.json" \
            2>&1 | tee "$EVIDENCE_DIR/finalization.log"

      - name: Apply solo audit and target observation attestations
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/asi-verifiable-engineering/scripts/apply_review_attestation.py \
            "$EVIDENCE_DIR/manifest.json" \
            "$EVIDENCE_DIR/gates/independent_audit.log" \
            "$EVIDENCE_DIR/gates/target_environment_observation.log" \
            2>&1 | tee "$EVIDENCE_DIR/attestation-application.log"

      - name: Recompute and validate evidence bindings
        continue-on-error: true
        run: |
          set -o pipefail
          python skills/asi-verifiable-engineering/scripts/validate_evidence.py \
            "$EVIDENCE_DIR/manifest.json" \
            --evidence-dir "$EVIDENCE_DIR" \
            --policy .asi/policy.yml \
            --repo-root . \
            2>&1 | tee "$EVIDENCE_DIR/binding-validation.log"

      - name: Derive actual approval decision
        continue-on-error: true
        run: |
          set +e
          python skills/asi-verifiable-engineering/scripts/evaluate_change.py \
            .asi/policy.yml \
            "$EVIDENCE_DIR/manifest.json" \
            --evidence-dir "$EVIDENCE_DIR" \
            --repo-root . \
            > "$EVIDENCE_DIR/decision.json"
          status=$?
          printf '%s\n' "$status" > "$EVIDENCE_DIR/decision-exit-code.txt"
          cat "$EVIDENCE_DIR/decision.json"
          exit 0

      - name: Upload actual CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/asi-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Confirm clean working tree
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Enforce technical gates and derived approval
        if: always()
        run: |
          python - "$EVIDENCE_DIR/manifest.json" "$EVIDENCE_DIR/decision.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          decision = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          external = {
              "branch_protection",
              "independent_audit",
              "target_environment_observation",
          }
          technical_failures = sorted(
              name
              for name, state in manifest["gates"].items()
              if name not in external and state != "passed"
          )
          if technical_failures:
              raise SystemExit(
                  "Technical gates failed or were not verified: "
                  + ", ".join(technical_failures)
              )
          if decision["decision"] != "APPROVED":
              raise SystemExit(
                  "Commit remains blocked by derived decision: "
                  + "; ".join(decision["blockers"])
              )
          PY
