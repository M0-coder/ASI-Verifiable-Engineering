name: Validate ASI Skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package, policy, and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/asi-pycache

    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Record baseline
        run: |
          set -euo pipefail
          printf 'commit=%s\n' "$GITHUB_SHA"
          python --version
          git status --short

      - name: Validate Agent Skill package
        run: python tools/validate_skill_package.py skills/asi-verifiable-engineering

      - name: Validate repository policy
        run: python skills/asi-verifiable-engineering/scripts/validate_policy.py .asi/policy.yml

      - name: Validate example evidence manifest
        run: python skills/asi-verifiable-engineering/scripts/validate_evidence.py skills/asi-verifiable-engineering/assets/evidence-manifest.example.json

      - name: Validate JSON syntax
        run: python -m json.tool skills/asi-verifiable-engineering/assets/evidence-manifest.example.json > /dev/null

      - name: Compile Python sources
        run: python -m compileall -q tools tests skills/asi-verifiable-engineering/scripts

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Confirm clean working tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
