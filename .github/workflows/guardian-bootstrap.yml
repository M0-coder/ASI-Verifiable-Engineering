name: Guardian Bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/asi-trust-anchor.yml
      - .github/workflows/guardian-bootstrap.yml
      - guardian/**

permissions:
  contents: read

jobs:
  bootstrap:
    name: Verify measured gates and derive decision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/asi-guardian-pycache

    steps:
      - name: Check out bootstrap candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile trusted verifier
        run: >-
          python3 -m py_compile
          guardian/verify_run.py
          guardian/verify_run_v2.py
          guardian/verify_protection_binding.py
          guardian/verify_contract.py

      - name: Run guardian regression tests
        working-directory: guardian
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Validate trust policy JSON
        run: python3 -m json.tool guardian/trust-policy.json >/dev/null

      - name: Validate trust-anchor check contract
        run: >-
          python3 guardian/verify_contract.py
          --workflow .github/workflows/asi-trust-anchor.yml
          --policy guardian/trust-policy.json
          --verifier guardian/verify_protection_binding.py

      - name: Confirm clean working tree
        run: test -z "$(git status --porcelain)"
