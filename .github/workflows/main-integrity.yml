name: Verify Main Integrity

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-main:
    name: Verify merged main integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/asi-pycache
      ASI_REPOSITORY: ${{ github.repository }}
      ASI_MERGED_COMMIT: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Resolve builder context
        run: |
          set -euo pipefail
          builder_context_id="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.asi/change-budget.json').read_text(encoding='utf-8'))
          value = data.get('builder_context_id')
          if not isinstance(value, str) or not value.strip():
              raise SystemExit('builder_context_id is required')
          print(value)
          PY
          )"
          printf 'ASI_BUILDER_CONTEXT_ID=%s\n' "$builder_context_id" >> "$GITHUB_ENV"

      - name: Install pinned CI toolchain
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps -r requirements-ci.lock

      - name: Validate package and policy
        run: |
          python tools/validate_skill_package.py skills/asi-verifiable-engineering
          python skills/asi-verifiable-engineering/scripts/validate_policy.py .asi/policy.yml

      - name: Run deterministic quality controls
        run: |
          python skills/asi-verifiable-engineering/scripts/check_format.py .
          python -m ruff check .
          python -m mypy --config-file mypy.ini tools skills/asi-verifiable-engineering/scripts

      - name: Run tests and security controls
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python skills/asi-verifiable-engineering/scripts/scan_secrets.py .
          python skills/asi-verifiable-engineering/scripts/scan_supply_chain.py .

      - name: Verify effective main protection
        env:
          ASI_GITHUB_ADMIN_TOKEN: ${{ secrets.ASI_GITHUB_ADMIN_TOKEN }}
          ASI_PROTECTED_BRANCH: main
        run: python skills/asi-verifiable-engineering/scripts/check_branch_protection.py

      - name: Verify merged PR audit, observation, and owner authorization
        run: python skills/asi-verifiable-engineering/scripts/verify_merged_pr.py

      - name: Confirm exact and clean main state
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
