name: ASI Trust Anchor

on:
  workflow_run:
    workflows:
      - Validate ASI Skill
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: asi-trust-anchor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Guardian execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ASI_GITHUB_ADMIN_TOKEN: ${{ secrets.ASI_GITHUB_ADMIN_TOKEN }}
      ASI_TRUST_POLICY: guardian/trust-policy.json

    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: main

      - name: Verify unprivileged workflow evidence
        run: python3 guardian/verify_run.py
