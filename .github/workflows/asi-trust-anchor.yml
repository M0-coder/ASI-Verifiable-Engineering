name: ASI Trust Anchor

on:
  workflow_run:
    workflows:
      - Validate ASI Skill
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: asi-trust-anchor-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: ASI Trust Anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ASI_GITHUB_ADMIN_TOKEN: ${{ secrets.ASI_GITHUB_ADMIN_TOKEN }}
      ASI_TRUST_POLICY: guardian/trust-policy.json
      ASI_TRUST_WORKFLOW: .github/workflows/asi-trust-anchor.yml
      ASI_TRUST_VERIFIER: guardian/verify_run_v3.py
      ASI_TRUST_ANCHOR_SHA: ${{ github.workflow_sha }}
      ASI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ASI_PROTECTED_BRANCH: main

    steps:
      - name: Check out immutable trust-anchor verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}

      - name: Verify immutable trust-anchor checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASI_TRUST_ANCHOR_SHA"

      - name: Prepare trust-anchor output
        run: |
          echo "ASI_TRUST_OUTPUT=$RUNNER_TEMP/asi-trust-anchor" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/asi-trust-anchor"

      - name: Register trusted check contract from main
        id: registration
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          python3 guardian/verify_contract.py \
            --workflow .github/workflows/asi-trust-anchor.yml \
            --policy guardian/trust-policy.json \
            --verifier guardian/verify_protection_binding.py \
            2>&1 | tee "$ASI_TRUST_OUTPUT/contract-registration.log"

      - name: Verify unprivileged workflow evidence and trusted gates
        id: evidence
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 guardian/verify_run_v3.py 2>&1 |
            tee "$ASI_TRUST_OUTPUT/evidence-verification.log"

      - name: Upload trust-anchor evidence
        if: github.event_name == 'workflow_run' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-trust-anchor-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}-${{ github.event.workflow_run.head_sha }}-${{ github.workflow_sha }}
          path: ${{ runner.temp }}/asi-trust-anchor/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce registration decision
        if: github.event_name == 'workflow_dispatch' && always()
        env:
          REGISTRATION_OUTCOME: ${{ steps.registration.outcome }}
        run: |
          set -euo pipefail
          test "$REGISTRATION_OUTCOME" = "success"

      - name: Enforce trust-anchor decision
        if: github.event_name == 'workflow_run' && always()
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          test "$EVIDENCE_OUTCOME" = "success"
