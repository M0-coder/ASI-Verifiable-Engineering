version: 1

doctrine:
  name: ASI Verifiable Engineering
  version: "1.2"
  skill_version: "0.1.0-draft.2"
  source: "skills/asi-verifiable-engineering/SKILL.md"

repository:
  default_risk: medium
  policy_owner: "REPLACE_WITH_OWNER"
  protected_branches:
    - main
  protected_paths:
    - ".asi/**"
    - ".github/**"
    - "mypy.ini"
    - "requirements-ci.lock"
    - "auth/**"
    - "payments/**"
    - "migrations/**"
    - "infra/**"

commands:
  install: "REPLACE_WITH_PINNED_INSTALL_COMMAND"
  integrity: "REPLACE_WITH_CHANGE_BUDGET_COMMAND"
  branch_protection: "REPLACE_WITH_BRANCH_PROTECTION_API_CHECK"
  format_check: "REPLACE_WITH_FORMAT_CHECK_COMMAND"
  lint: "REPLACE_WITH_LINT_COMMAND"
  typecheck: "REPLACE_WITH_STRICT_TYPECHECK_COMMAND"
  build: "REPLACE_WITH_BUILD_COMMAND"
  package_installability: "REPLACE_WITH_PACKAGE_INSTALLABILITY_COMMAND"
  unit_tests: "REPLACE_WITH_UNIT_TEST_COMMAND"
  integration_tests: "REPLACE_WITH_INTEGRATION_TEST_COMMAND"
  secret_scan: "REPLACE_WITH_SECRET_SCAN_COMMAND"
  dependency_scan: "REPLACE_WITH_SUPPLY_CHAIN_SCAN_COMMAND"
  test_honesty: "REPLACE_WITH_ADVERSARIAL_TEST_COMMAND"
  rollback_check: "REPLACE_WITH_ROLLBACK_REHEARSAL_COMMAND"
  independent_audit: "REPLACE_WITH_INDEPENDENT_REVIEW_ATTESTATION_COMMAND"
  target_environment_observation: "REPLACE_WITH_TARGET_OBSERVATION_ATTESTATION_COMMAND"

required_gates:
  integrity: true
  branch_protection: true
  format_check: true
  lint: true
  typecheck: true
  build: true
  package_installability: true
  unit_tests: true
  integration_tests: true
  secret_scan: true
  dependency_scan: true
  rollback_check: true
  independent_audit: true
  target_environment_observation: true

risk_escalation:
  high:
    - "auth/**"
    - "payments/**"
    - "migrations/**"
    - ".github/workflows/**"
    - "infra/**"
    - "dependencies/**"
  critical:
    - "keys/**"
    - "production-access/**"
    - "destructive-operations/**"

assurance:
  low:
    minimum_t: T4
    independence:
      - I1
      - I2
  medium:
    minimum_t: T4
    independence:
      - I1
      - I2
  high:
    minimum_t: T5
    independence:
      - I2
      - I3
  critical:
    minimum_t: T6
    independence:
      - I2
      - I3
    dual_human_approval: true

automated_acceptance:
  enabled: true
  eligible_risks:
    - low
    - medium
  line_by_line_review_default: false
  require_all_required_gates_passed: true
  require_no_unverified: true
  require_no_residual_risks_for_automatic: true
  require_test_honesty: true
  require_change_budget: true
  require_distinct_builder_auditor: true
  require_rollback_tested: true
  require_policy_digest: true
  require_diff_digest: true

evidence:
  directory: ".asi/evidence"
  retention_days: 90
  require_commit_sha: true
  require_exit_codes: true
  require_artifact_digests: true
  require_measured_commands: true
  require_binding_verification: true

deployment:
  build_once_promote_same_artifact: true
  require_rollback: true
  require_canary_for_high_risk: true
  autonomous_production_changes: false

agent_permissions:
  direct_push_protected_branch: false
  self_approve: false
  modify_policy_in_same_change: false
  disable_required_gate: false
  access_production_secrets: false
  irreversible_action_without_human: false

exceptions:
  allow_permanent: false
  require_owner: true
  require_expiry: true
  require_compensating_controls: true
